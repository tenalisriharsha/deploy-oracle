name: 'Deploy Oracle'
description: 'Scores the deploy risk of a pull request (change size, blast radius, test coverage delta) and posts the report with a rollout recommendation as a PR comment.'
author: 'tenalisriharsha'
branding:
  icon: 'activity'
  color: 'purple'

inputs:
  base:
    description: 'Base ref/sha to diff against. Defaults to the pull request base commit.'
    required: false
  head:
    description: 'Head ref/sha to diff. Defaults to the pull request head commit.'
    required: false
  token:
    description: 'Token used to read and post the PR comment.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install deploy-oracle dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Build deploy-oracle
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Analyze pull request
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node dist/action/index.js
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
